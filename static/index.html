<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenmatsuyora</title><link rel="icon" href="/star.svg"><link rel="stylesheet" href="/style.css"></head>
<body><header><span class="brand"><b>✦</b> Tenmatsuyora</span><span id="state" role="status">Подключение…</span><span id="count"></span></header>
<main><section class="universe" aria-label="Карта диалога"><svg id="sky" viewBox="0 0 1000 900" role="img" aria-label="Звёздная карта сохранённых сообщений"><defs><radialGradient id="halo"><stop stop-color="#ffe4a0" stop-opacity=".85"/><stop offset=".2" stop-color="#eeb94b" stop-opacity=".22"/><stop offset="1" stop-color="#eeb94b" stop-opacity="0"/></radialGradient><radialGradient id="coreHalo"><stop stop-color="white" stop-opacity=".95"/><stop offset=".16" stop-color="#fff5db" stop-opacity=".35"/><stop offset="1" stop-color="#f6c97b" stop-opacity="0"/></radialGradient></defs><g id="stars"></g><g id="links"></g><g id="nodes"></g></svg><p id="node-info" aria-live="polite"></p></section>
<section class="conversation" aria-label="Чат"><div class="chat-title">Диалог <span id="model"></span></div><div id="messages" role="log" aria-live="polite"></div><p id="notice" role="status"></p><form id="composer"><textarea id="message" rows="2" maxlength="12000" required aria-label="Сообщение" placeholder="Напишите сообщение…"></textarea><button type="submit" id="send" aria-label="Отправить">➤</button></form></section></main>
<script type="module" src="/app.js"></script></body></html>
