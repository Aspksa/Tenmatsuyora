<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenmatsuyora</title><link rel="icon" href="/star.svg"><link rel="stylesheet" href="/style.css"></head>
<body><svg id="celestial-background" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg><header><span class="brand"><b class="brand-star" aria-hidden="true">✦</b> Tenmatsuyora</span><button id="cloud-toggle" class="quiet" aria-expanded="false" aria-label="Настройки Cloud.ru"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-10 6 6 0 0 1 11 3 3.5 3.5 0 0 1-1 7Z"/></svg><span id="state" role="status">Подключение…</span></button><span id="count"></span></header><form id="cloud-panel" hidden class="cloud-panel"><strong>Cloud.ru</strong><label>Основная модель<select id="cloud-model"><option value="">Загрузите каталог</option></select></label><label>Каталог<select id="cloud-category"><option value="all">Все модели</option><option value="llm">LLM / неуточнённые</option><option value="embedding">Embedding</option><option value="rerank">Rerank</option><option value="other">Другие</option></select></label><div id="cloud-catalog" role="list"></div><label>API-ключ<input id="cloud-key" type="password" maxlength="4096" autocomplete="off"></label><label class="cloud-check"><input id="cloud-remember" type="checkbox"> Запомнить ключ (Windows DPAPI)</label><label>Эмбеддинги<select id="cloud-embedding"><option value="">Выключены</option></select></label><label class="cloud-check"><input id="cloud-consent" type="checkbox"> Разрешаю дополнительные платные запросы и передачу выбранных фрагментов истории для эмбеддингов</label><small>Проверка ключа и каталога не генерирует ответ. Эмбеддинги выключены по умолчанию. При смене ПК защищённый ключ нужно ввести снова.</small><div><button type="submit">Проверить и применить</button><button type="button" id="cloud-clear">Отключить</button></div><small id="cloud-status" role="status"></small></form>
<main><section class="universe" aria-label="Карта диалога"><svg id="sky" viewBox="0 0 1000 900" role="group" aria-label="Звёздная карта сохранённых сообщений"><defs><radialGradient id="halo"><stop stop-color="#ffe4a0" stop-opacity=".85"/><stop offset=".2" stop-color="#eeb94b" stop-opacity=".22"/><stop offset="1" stop-color="#eeb94b" stop-opacity="0"/></radialGradient><radialGradient id="coreHalo"><stop stop-color="white" stop-opacity=".95"/><stop offset=".16" stop-color="#fff5db" stop-opacity=".35"/><stop offset="1" stop-color="#f6c97b" stop-opacity="0"/></radialGradient></defs><g id="stars"></g><g id="links"></g><g id="nodes"></g></svg><div class="map-controls" aria-label="Управление картой"><button id="overview" title="Вся галактика" aria-label="Вся галактика"><svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='8'/><circle cx='12' cy='12' r='2'/></svg></button><button id="active-view" title="Активное созвездие" aria-label="Активное созвездие"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z'/></svg></button><button id="zoom-in" aria-label="Приблизить"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M12 5v14M5 12h14'/></svg></button><button id="zoom-out" aria-label="Отдалить"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M5 12h14'/></svg></button><button id="effects-toggle" aria-label="Настройки эффектов" title="Настройки эффектов" aria-expanded="false"><svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='3'/><path d='M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2'/></svg></button><button id="fullscreen" aria-label="Полноэкранная карта" title="Полноэкранная карта"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6'/></svg></button></div><div id="effects-panel" class="effects-panel" hidden><label>Свечение <input id="glow-setting" type="range" min=".25" max="1.5" step=".05" value="1"></label><label>Скорость <input id="speed-setting" type="range" min="0" max="2" step=".1" value="1"></label><label>Качество <select id="quality-setting"><option value="high">Высокое</option><option value="low">Экономное</option></select></label><label>Кинематографическая камера <input id="cinematic-setting" type="checkbox"></label><small id="map-save-status" role="status"></small></div><span id="graph-count" aria-live="polite"></span><p id="node-info" aria-live="polite"></p></section>
<section class="conversation" aria-label="Чат"><div class="chat-title"><span id="work-light" aria-hidden="true"></span>Диалог <span id="model"></span></div><div id="work-stage" role="status" aria-live="polite"></div><div class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></div><div id="messages" role="log" aria-live="polite"></div><p id="notice" role="status"></p><form id="composer"><span class="composer-star" aria-hidden="true">✦</span><textarea id="message" rows="2" maxlength="12000" required aria-label="Сообщение" placeholder="Напишите сообщение…"></textarea><button type="submit" id="send" aria-label="Отправить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 9 15M22 2l-7 20-6-7-7-3 20-10Z"/></svg></button></form></section></main>
<script type="module" src="/app.js"></script></body></html>
